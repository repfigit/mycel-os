[package]
name = "mycel-shell"
version = "0.1.0"
edition = "2021"
description = "Mycel OS GUI Shell"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "wayland", "x11", "crisp"] }
tokio = { version = "1.35", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
