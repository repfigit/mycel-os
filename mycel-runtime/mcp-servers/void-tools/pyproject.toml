[project]
name = "void-tools"
version = "0.1.0"
description = "MCP server for Void Linux system tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pin to 1.x: the server uses the @server.list_tools()/@server.call_tool()
    # decorator API, which was removed in mcp 2.0.
    "mcp>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
void-tools = "void_tools:main"
