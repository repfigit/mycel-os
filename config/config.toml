# Mycel OS Configuration
# The intelligent network beneath everything.

[system]
# Node identification
hostname = "mycel"
node_name = "default"

# Paths
data_dir = "/var/lib/mycel"
cache_dir = "/var/cache/mycel"
config_dir = "/etc/mycel"

[ai]
# Local AI backend selection: "auto" (probe llama-cpp first, then Ollama),
# "ollama", or "llama-cpp". Override via MYCEL_LOCAL_BACKEND.
local_backend = "auto"
local_enabled = true
local_model = "qwen3:8b"  # Native tool-calling + strong code gen; use qwen3:4b on <8GB RAM
local_url = "http://localhost:11434"
llama_cpp_url = "http://127.0.0.1:8080/v1"  # Override via MYCEL_LLAMA_CPP_URL
local_timeout_secs = 120

# Cloud AI (auto-detects configured provider, or set cloud_provider explicitly)
# Supported env vars include: VENICE_API_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY,
# OPENAI_API_KEY, GEMINI_API_KEY, DEEPSEEK_API_KEY, GROQ_API_KEY, CEREBRAS_API_KEY,
# XAI_API_KEY, MISTRAL_API_KEY, FIREWORKS_API_KEY, TOGETHER_API_KEY, MINIMAX_API_KEY,
# MOONSHOT_API_KEY, AWS_BEARER_TOKEN_BEDROCK (or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY).
# Override via MYCEL_CLOUD_PROVIDER and MYCEL_CLOUD_MODEL.
cloud_enabled = false
# cloud_provider = ""  # Empty = auto-detect (e.g. "venice", "anthropic", "openai", "google", "openrouter")
cloud_api_key = ""  # Set via OPENROUTER_API_KEY or provider-specific env var
cloud_model = "anthropic/claude-3.5-sonnet"  # Or provider model, e.g. "llama-3.3-70b" for venice
cloud_timeout_secs = 60

# Optional custom or overridden provider definitions:
# [providers.my-local-vllm]
# api = "openai-completions"
# base_url = "http://localhost:8000/v1"
# default_model = "Qwen/Qwen2.5-72B-Instruct"
# requires_auth = false

# Routing preferences
prefer_local = true
escalate_threshold = 0.7  # Confidence below this triggers cloud

[router]
# Auto-router: decides local vs cloud per query (decision list, not ML).
# Order: privacy -> size -> budget -> task type -> default(local+escalate).
#
# Max estimated tokens to keep a prompt on the local model.
# Local CPU context is ~4096; leave headroom for the response.
local_ctx_safe_tokens = 3000
# Daily cloud budget in USD. 0.0 = unlimited. Over budget => local only.
cloud_budget_daily_usd = 0.0
# true = favor fast local answers over cloud quality
prefer_fast = false
# Escalate to cloud when a local answer looks inadequate
escalate_on_low_confidence = true

[selfdev]
# Self-development loop: the OS files GitHub issues about its own
# limitations (missing tools/commands, repeated low-confidence answers).
# OPT-IN - off by default. Issues are deduped, rate-capped, PII-sanitized,
# and filed via the `gh` CLI (uses your existing gh auth, no token stored).
enabled = false
# Target repo (owner/name)
repo = "repfigit/mycel-os"
# Max issues filed per rolling 7-day window
max_issues_per_week = 5
# Don't re-file the same limitation within this many days
dedup_window_days = 7
# Actually file to GitHub (vs. log locally). Requires `gh` authenticated.
file_to_github = false

[sandbox]
# Isolation for AI-generated code. The model's output is untrusted.
# "bwrap" (default): bubblewrap - no network, read-only filesystem, credential
#   dirs (~/.ssh, ~/.aws, ~/.config/gh, ...) hidden, empty environment,
#   private /tmp and /run. If bubblewrap is missing, execution is REFUSED.
# "host": run directly with the daemon's privileges (opt-in, not recommended).
mode = "bwrap"
bwrap_path = "bwrap"
allow_network = false
# Directories generated code may write to (everything else is read-only)
writable_paths = []
# Extra paths to hide, in addition to the built-in credential list
hidden_paths = []
tmp_size_mb = 64
# Task cap inside the sandbox (RLIMIT_NPROC) - stops fork bombs.
# Counts every task/thread of the sandbox user across the host, so keep it
# above your usual desktop task count. Root bypasses it.
max_processes = 4096

# Timeout and Python memory cap come from top-level keys:
#   execution_timeout_secs = 30
#   execution_memory_mb = 512

[recovery]
# Execution recovery: when generated code fails, classify the failure and
# decide whether a repair may be attempted. The decision itself is pure Rust;
# the model can only *propose* a fix.
#
# SAFETY: auto_repair is OFF by default. Even when enabled, only a plain
# non-zero exit inside a fully isolated bubblewrap sandbox (no network, no
# writable paths, untruncated output) is eligible; timeouts, signals, a missing
# sandbox and host mode all abort for inspection instead.
enabled = true
# Opt-in: allow a verified repair attempt for eligible failures.
auto_repair = false
# Maximum repair attempts before aborting for inspection.
max_repair_attempts = 1
# Largest candidate program accepted, in bytes.
max_candidate_bytes = 32768
# Re-run an accepted candidate and require identical output.
require_repeat_check = false

[collective]
# Decentralized network participation
enabled = false

# NEAR Protocol (coordination, registry, payments)
near_network = "testnet"  # or "mainnet"
near_account = ""
near_contract = "patterns.mycel.testnet"

# Bittensor (AI evaluation, rewards)
bittensor_network = "finney"  # or "test"
bittensor_coldkey = ""
bittensor_hotkey = ""
bittensor_subnet = 0  # TBD

# IPFS (pattern storage)
ipfs_enabled = false
ipfs_api = "/ip4/127.0.0.1/tcp/5001"

# Privacy settings
share_patterns = false  # Opt-in to share learned patterns
differential_privacy_epsilon = 1.0

[mesh]
# Personal device mesh (sync between your devices). Off by default: no UDP
# port is opened and nothing is advertised or synced while disabled.
enabled = false
listen_port = 51820

# Mycel IDs of your OWN devices. Each device logs its ID at startup
# ("Mycel ID: ..."). Only listed devices can exchange events with this one;
# every other handshake, mDNS record, or packet is ignored.
trusted_peers = []

# Replicate conversation history to trusted devices (off by default)
sync_ai_context = false

# Discovery (only advertises/accepts devices listed in trusted_peers)
mdns_enabled = true

# NAT traversal (safe defaults; STUN only runs when stun_servers is non-empty)
stun_servers = []
persistent_keepalive_secs = 25

# Zero-knowledge E2E-encrypted relay (opt-in, off by default)
relay_enabled = false
# relay_addr = "relay.example.com:51822"
relay_server_enabled = false
# relay_listen_addr = "0.0.0.0:51822"

# --- Planned, not yet implemented by the runtime ---
# interface = "mycel0"
# sync_config = true
# sync_patterns = true
# sync_documents = false

[ui]
# Interface settings
default_layout = "conversation"
theme = "dark"
font_family = "monospace"

# Evolution settings
learn_from_usage = true
adopt_collective_patterns = false  # Opt-in

[logging]
level = "info"  # debug, info, warn, error
file = "/var/log/mycel/runtime.log"
max_size_mb = 100
max_files = 5
