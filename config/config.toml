# Mycel OS Configuration
# The intelligent network beneath everything.

[system]
# Node identification
hostname = "mycel"
node_name = "default"

# Paths
data_dir = "/var/lib/mycel"
cache_dir = "/var/cache/mycel"
config_dir = "/etc/mycel"

[ai]
# Local AI (Ollama)
local_enabled = true
local_model = "qwen3:8b"  # Native tool-calling + strong code gen; use qwen3:4b on <8GB RAM
local_url = "http://localhost:11434"
local_timeout_secs = 120

# Cloud AI (via OpenRouter - OpenAI-compatible API)
cloud_enabled = false
cloud_api_key = ""  # Set via OPENROUTER_API_KEY env var
cloud_model = "anthropic/claude-3.5-sonnet"  # OpenRouter model format
cloud_timeout_secs = 60

# Routing preferences
prefer_local = true
escalate_threshold = 0.7  # Confidence below this triggers cloud

[router]
# Auto-router: decides local vs cloud per query (decision list, not ML).
# Order: privacy -> size -> budget -> task type -> default(local+escalate).
#
# Max estimated tokens to keep a prompt on the local model.
# Local CPU context is ~4096; leave headroom for the response.
local_ctx_safe_tokens = 3000
# Daily cloud budget in USD. 0.0 = unlimited. Over budget => local only.
cloud_budget_daily_usd = 0.0
# true = favor fast local answers over cloud quality
prefer_fast = false
# Escalate to cloud when a local answer looks inadequate
escalate_on_low_confidence = true

[selfdev]
# Self-development loop: the OS files GitHub issues about its own
# limitations (missing tools/commands, repeated low-confidence answers).
# OPT-IN - off by default. Issues are deduped, rate-capped, PII-sanitized,
# and filed via the `gh` CLI (uses your existing gh auth, no token stored).
enabled = false
# Target repo (owner/name)
repo = "repfigit/mycel-os"
# Max issues filed per rolling 7-day window
max_issues_per_week = 5
# Don't re-file the same limitation within this many days
dedup_window_days = 7
# Actually file to GitHub (vs. log locally). Requires `gh` authenticated.
file_to_github = false

[executor]
# Sandboxed code execution
enabled = true
sandbox_type = "firejail"  # or "bubblewrap"
timeout_secs = 30
max_memory_mb = 512
allowed_languages = ["python", "javascript", "bash"]

[collective]
# Decentralized network participation
enabled = false

# NEAR Protocol (coordination, registry, payments)
near_network = "testnet"  # or "mainnet"
near_account = ""
near_contract = "patterns.mycel.testnet"

# Bittensor (AI evaluation, rewards)
bittensor_network = "finney"  # or "test"
bittensor_coldkey = ""
bittensor_hotkey = ""
bittensor_subnet = 0  # TBD

# IPFS (pattern storage)
ipfs_enabled = false
ipfs_api = "/ip4/127.0.0.1/tcp/5001"

# Privacy settings
share_patterns = false  # Opt-in to share learned patterns
differential_privacy_epsilon = 1.0

[mesh]
# Personal device mesh (sync between your devices)
enabled = false

# WireGuard mesh network
interface = "mycel0"
listen_port = 51820

# Sync settings
sync_config = true
sync_patterns = true
sync_documents = false  # Opt-in
sync_ai_context = true

# Discovery
mdns_enabled = true  # Local network discovery
relay_enabled = true  # For NAT traversal

[ui]
# Interface settings
default_layout = "conversation"
theme = "dark"
font_family = "monospace"

# Evolution settings
learn_from_usage = true
adopt_collective_patterns = false  # Opt-in

[logging]
level = "info"  # debug, info, warn, error
file = "/var/log/mycel/runtime.log"
max_size_mb = 100
max_files = 5
