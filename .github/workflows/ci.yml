name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycel-runtime/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: mycel-runtime
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: mycel-runtime
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: mycel-runtime
        run: cargo build --verbose

      - name: Install bubblewrap (sandbox integration tests)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all -- true && echo 'bwrap OK'

      - name: Run tests
        working-directory: mycel-runtime
        shell: bash
        run: |
          set -o pipefail
          cargo test --verbose 2>&1 | tee test.log
          if grep -q 'skipping sandbox integration test' test.log; then
            echo '::error::sandbox integration tests were skipped (bwrap unavailable)'
            exit 1
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        working-directory: mycel-runtime
        run: cargo audit

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mycel-runtime/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        working-directory: mycel-runtime
        run: cargo build --release

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: mycel-runtime-linux-x86_64
          path: mycel-runtime/target/release/mycel-runtime
